<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy USA Numbers — Arknet SMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    :root {
      --brown-dark: #4a2c2a;
      --brown: #6b4423;
      --brown-light: #8b5e3c;
      --pink: #ec4899;
      --pink-light: #f9a8d4;
      --pink-soft: #fdf2f8;
      --white: #ffffff;
      --cream: #fef9f5;
      --green: #22c55e;
      --red: #dc2626;
      --warning: #b45309;
      --bottom-nav-height: 68px;
    }
    html, body { overflow-x: hidden; }
    body {
      background: var(--cream);
      color: var(--brown-dark);
      min-height: 100vh;
      line-height: 1.5;
      padding-bottom: calc(var(--bottom-nav-height) + 20px);
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    .topbar { background: var(--brown-dark); position: sticky; top: 0; z-index: 500; }
    .topbar-inner { max-width: 500px; margin: 0 auto; padding: 0.75rem 1rem; display: flex; align-items: center; gap: 0.7rem; }
    .back-btn { width: 40px; height: 40px; border-radius: 12px; background: var(--white); display: flex; align-items: center; justify-content: center; font-size: 1rem; color: var(--brown-dark); flex-shrink: 0; }
    .page-title { font-size: 0.95rem; font-weight: 700; flex: 1; color: white; }
    .balance-chip { display: flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.75rem; background: rgba(255,255,255,0.1); border: 1.5px solid var(--pink); border-radius: 10px; font-size: 0.8rem; font-weight: 700; flex-shrink: 0; color: var(--pink-light); }

    .container { max-width: 500px; margin: 0 auto; padding: 1.5rem 1rem 0; display: flex; flex-direction: column; gap: 1rem; }
    .greeting { text-align: center; margin-bottom: 0.2rem; }
    .greeting h2 { font-size: 1.2rem; font-weight: 700; }
    .greeting h2 span { color: var(--pink); }
    .subtitle { text-align: center; margin-bottom: 1rem; }
    .subtitle .flag { font-size: 1.6rem; margin-bottom: 0.3rem; display: block; }
    .subtitle h3 { font-size: 0.95rem; font-weight: 700; letter-spacing: 0.02em; }
    .subtitle p { font-size: 0.82rem; color: var(--brown-light); margin-top: 0.3rem; }

    .main-card { background: var(--white); border: 1px solid #f5e6e0; border-radius: 20px; padding: 1.4rem 1.2rem; box-shadow: 0 4px 20px rgba(74,44,42,0.06); }
    .field-label { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; display: block; }
    .field-label .req { color: var(--red); margin-left: 2px; }

    .search-wrap { position: relative; margin-bottom: 1rem; }
    .search-wrap input { width: 100%; padding: 0.9rem 1rem 0.9rem 2.6rem; border: 1.5px solid #f0dcd4; outline: none; border-radius: 12px; font-size: 0.9rem; font-family: 'Poppins', sans-serif; background: var(--cream); color: var(--brown-dark); }
    .search-wrap input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(236,72,153,0.12); background: white; }
    .search-wrap input::placeholder { color: #b89b8f; }
    .search-wrap input:disabled { background: #f8f5f3; cursor: not-allowed; }
    .search-wrap .search-icon { position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--brown-light); font-size: 0.9rem; pointer-events: none; }

    .dropdown { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: #fff; border: 1.5px solid var(--pink); border-radius: 12px; box-shadow: 0 12px 30px rgba(236,72,153,0.15); max-height: 320px; overflow-y: auto; z-index: 100; display: none; }
    .dropdown.active { display: block; }
    .dropdown-item { width: 100%; padding: 0.85rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: 0.7rem; cursor: pointer; border-bottom: 1px solid #f0dcd4; text-align: left; }
    .dropdown-item:last-child { border-bottom: none; }
    .dropdown-item:hover { background: var(--pink-soft); }
    .dropdown-item .dd-name { font-size: 0.88rem; font-weight: 600; color: var(--brown-dark); text-transform: capitalize; }
    .dropdown-item .dd-price { font-size: 0.88rem; font-weight: 800; color: var(--pink); flex-shrink: 0; }
    .dropdown-item .dd-price.loading { color: #b89b8f; font-weight: 500; font-size: 0.78rem; }
    .dropdown-empty { padding: 1rem; text-align: center; font-size: 0.82rem; color: var(--brown-light); }
    .dropdown-loading { padding: 1rem; text-align: center; font-size: 0.82rem; color: var(--brown-light); }

    .selected-chip { background: var(--pink-soft); border-radius: 12px; padding: 0.8rem 1rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.6rem; font-size: 0.88rem; border: 1px solid var(--pink-light); }
    .selected-chip .lbl { color: var(--brown-light); font-weight: 500; }
    .selected-chip .val { font-weight: 700; color: var(--brown-dark); text-transform: capitalize; }

    .price-card { background: linear-gradient(135deg, var(--pink-soft), #fce7f3); border-radius: 14px; padding: 1.2rem 1rem; text-align: center; margin: 1rem 0; }
    .price-card .price { font-size: 1.5rem; font-weight: 800; color: var(--pink); }

    .action-btn { width: 100%; padding: 1rem; border-radius: 14px; background: var(--pink); color: #fff; font-size: 0.95rem; font-weight: 700; font-family: 'Poppins', sans-serif; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 0.5rem; box-shadow: 0 10px 30px rgba(236,72,153,0.3); transition: 0.25s; }
    .action-btn:hover:not(:disabled) { background: var(--brown-dark); transform: translateY(-2px); }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--bottom-nav-height); background: #fff; border-top: 1px solid #f0dcd4; display: flex; justify-content: space-around; align-items: center; padding: 0 0.5rem; z-index: 700; box-shadow: 0 -4px 20px rgba(74,44,42,0.06); }
    .bottom-nav-inner { width: 100%; max-width: 500px; margin: 0 auto; display: flex; justify-content: space-around; align-items: center; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.2rem; padding: 0.5rem 0.25rem; color: #9ca3af; font-size: 0.68rem; font-weight: 500; text-decoration: none; }
    .nav-item i { font-size: 1.15rem; }
    .nav-item.active { color: var(--pink); font-weight: 600; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(74,44,42,0.7); backdrop-filter: blur(3px); display: none; align-items: flex-end; justify-content: center; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal { width: 100%; max-width: 500px; background: #fff; border-radius: 22px 22px 0 0; padding: 1.5rem 1.3rem 1.8rem; max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s ease; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-icon-top { width: 64px; height: 64px; border-radius: 18px; background: var(--pink-soft); color: var(--pink); display: flex; align-items: center; justify-content: center; font-size: 1.7rem; margin: 0 auto 1rem; }
    .modal-icon-top.warning { background: #fef3c7; color: var(--warning); }
    .modal-icon-top.error { background: #fee2e2; color: var(--red); }
    .modal-title { text-align: center; font-size: 1.15rem; font-weight: 700; margin-bottom: 0.4rem; }
    .modal-sub { text-align: center; font-size: 0.85rem; color: var(--brown-light); line-height: 1.6; margin-bottom: 1.3rem; }
    .confirm-box { background: var(--cream); border-radius: 14px; padding: 1rem 1.1rem; margin-bottom: 1.2rem; }
    .confirm-row { display: flex; justify-content: space-between; align-items: center; padding: 0.35rem 0; font-size: 0.85rem; }
    .confirm-row .label { color: var(--brown-light); }
    .confirm-row .value { color: var(--brown-dark); font-weight: 700; }
    .confirm-row.total { border-top: 1px solid #f0dcd4; margin-top: 0.4rem; padding-top: 0.7rem; font-size: 0.95rem; }
    .confirm-row.total .value { color: var(--pink); font-size: 1.05rem; }
    .modal-actions { display: flex; gap: 0.7rem; }
    .btn-cancel { flex: 1; padding: 0.9rem; border-radius: 12px; background: var(--cream); color: var(--brown-dark); font-weight: 600; font-size: 0.9rem; font-family: 'Poppins', sans-serif; }
    .btn-primary { flex: 2; padding: 0.9rem; border-radius: 12px; background: var(--pink); color: #fff; font-weight: 700; font-size: 0.9rem; box-shadow: 0 8px 20px rgba(236,72,153,0.3); font-family: 'Poppins', sans-serif; display: flex; align-items: center; justify-content: center; gap: 0.4rem; }

    @media (min-width: 700px) { .container, .topbar-inner, .bottom-nav-inner, .modal { max-width: 640px; } }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <span class="page-title">🇺🇸 Buy USA Numbers</span>
    <div class="balance-chip">
      <i class="fas fa-wallet"></i>
      <span id="topBalance">₦0</span>
    </div>
  </div>
</header>

<div class="container">
  <div class="greeting">
    <h2>Hi <span id="userFirstName">there</span> 👋</h2>
  </div>

  <div class="subtitle">
    <span class="flag">🇺🇸</span>
    <h3>USA SMS VERIFICATION</h3>
    <p>Real US SIM numbers. Fast and reliable verification.</p>
  </div>

  <div class="main-card">
    <label class="field-label" for="searchInput">Select Service <span class="req">*</span></label>
    <div class="search-wrap">
      <i class="fas fa-search search-icon"></i>
      <input type="text" id="searchInput" placeholder="Loading services..." autocomplete="off" disabled>
      <div class="dropdown" id="dropdown"></div>
    </div>
    <p style="font-size:0.78rem;color:var(--brown-light);margin-top:-0.4rem;margin-bottom:1.2rem;">
      Search and select the service you want to verify
    </p>

    <div class="selected-chip" id="selectedChip" style="display:none;">
      <span class="lbl">Selected:</span>
      <span class="val" id="selectedName">—</span>
    </div>

    <div class="price-card" id="priceCard" style="display:none;">
      <div class="price" id="selectedPrice">₦0</div>
    </div>

    <button class="action-btn" id="actionBtn" disabled>
      <i class="fas fa-bolt"></i>
      <span id="actionBtnText">Purchase Now</span>
    </button>
  </div>
</div>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a href="dashboard.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="wallet.html" class="nav-item"><i class="fas fa-wallet"></i><span>Wallet</span></a>
    <a href="dashboard.html#profile" class="nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
    <a href="https://wa.me/2349168165484" target="_blank" class="nav-item"><i class="fas fa-comment"></i><span>Contact</span></a>
  </div>
</nav>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent" onclick="event.stopPropagation()"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, updateDoc, deleteField,
    collection, addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBFm455uDjJ8z8mtMTHvas7ikT0zsS7Je8",
    authDomain: "arknetsms-430ee.firebaseapp.com",
    projectId: "arknetsms-430ee",
    storageBucket: "arknetsms-430ee.firebasestorage.app",
    messagingSenderId: "961504742152",
    appId: "1:961504742152:web:a9ade98d13465bb3b8babd",
    measurementId: "G-48V2T4CBJF"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const USA_API = "/api/textverified-buy";

  const USD_TO_NGN = 1500;
  const PROFIT_NGN = 950;

  let currentUser = null;
  let userWallet = 0;
  let allServices = [];
  let priceCache = {};
  let selectedService = null;
  let selectedPriceNGN = 0;

  const topBalance = document.getElementById('topBalance');
  const userFirstName = document.getElementById('userFirstName');
  const searchInput = document.getElementById('searchInput');
  const dropdown = document.getElementById('dropdown');
  const selectedChip = document.getElementById('selectedChip');
  const selectedName = document.getElementById('selectedName');
  const selectedPrice = document.getElementById('selectedPrice');
  const priceCard = document.getElementById('priceCard');
  const actionBtn = document.getElementById('actionBtn');
  const actionBtnText = document.getElementById('actionBtnText');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalContent = document.getElementById('modalContent');

  function fmtNaira(n) {
    return '₦' + Number(n || 0).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function capitalize(s) {
    return String(s || '').replace(/\b\w/g, c => c.toUpperCase());
  }
  function openModal(html) {
    modalContent.innerHTML = html;
    modalOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    modalOverlay.classList.remove('active');
    document.body.style.overflow = '';
  }
  modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }
    currentUser = user;
    const name = user.displayName || user.email.split('@')[0];
    userFirstName.textContent = capitalize(name.split(' ')[0]);

    await loadWallet();
    await loadServiceList();
  });

  async function loadWallet() {
    try {
      const snap = await getDoc(doc(db, 'users', currentUser.uid));
      if (snap.exists()) {
        const data = snap.data();
        userWallet = Number(data.wallet ?? data.walletBalance ?? data.balance ?? 0);
        topBalance.textContent = fmtNaira(userWallet);
      }
    } catch (err) { console.warn('Wallet:', err.message); }
  }

  async function loadServiceList() {
    try {
      const res = await fetch(`${USA_API}?action=servicelist`);
      const data = await res.json();
      if (!data.success || !Array.isArray(data.services)) throw new Error('Failed');

      allServices = data.services.map(s => ({
        id: s.id,
        name: capitalize(s.name),
        rawName: s.name
      }));

      if (allServices.length === 0) {
        searchInput.placeholder = 'No services available';
        searchInput.disabled = true;
        return;
      }

      searchInput.placeholder = `🔍 Search among ${allServices.length} services...`;
      searchInput.disabled = false;

    } catch (err) {
      console.error('Services load:', err);
      searchInput.placeholder = 'Failed to load services';
      searchInput.disabled = true;
    }
  }

  async function fetchPriceForService(serviceName) {
    if (priceCache[serviceName] !== undefined) return priceCache[serviceName];

    try {
      const res = await fetch(`${USA_API}?action=price&service=${encodeURIComponent(serviceName)}`);
      const data = await res.json();

      if (!data.success) {
        priceCache[serviceName] = null;
        return null;
      }

      const usd = Number(data.priceUSD || 0);
      const ngn = Math.ceil((usd * USD_TO_NGN) + PROFIT_NGN);
      priceCache[serviceName] = { usd, ngn };
      return priceCache[serviceName];

    } catch (err) {
      console.warn('Price error:', serviceName, err.message);
      priceCache[serviceName] = null;
      return null;
    }
  }

  async function fetchPricesForList(services) {
    return Promise.all(
      services.map(async s => {
        const cached = priceCache[s.rawName];
        if (cached !== undefined) return { ...s, priceData: cached };
        const priceData = await fetchPriceForService(s.rawName);
        return { ...s, priceData };
      })
    );
  }

  let searchTimeout = null;
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) { dropdown.classList.remove('active'); return; }

    const matches = allServices
      .filter(s => s.name.toLowerCase().includes(q))
      .slice(0, 8);

    if (matches.length === 0) {
      dropdown.innerHTML = '<div class="dropdown-empty">No services found</div>';
      dropdown.classList.add('active');
      return;
    }

    dropdown.innerHTML = '<div class="dropdown-loading">Loading prices...</div>';
    dropdown.classList.add('active');

    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(async () => {
      const withPrices = await fetchPricesForList(matches);
      renderDropdown(withPrices);
    }, 250);
  });

  function renderDropdown(services) {
    dropdown.innerHTML = services.map(s => {
      const pd = s.priceData;
      let priceText = '—';
      let loadingClass = '';
      if (pd === null) {
        priceText = 'N/A';
        loadingClass = ' loading';
      } else if (pd) {
        priceText = fmtNaira(pd.ngn);
      }
      return `
        <button class="dropdown-item" data-id="${s.id}" ${pd === null ? 'disabled' : ''}>
          <div><div class="dd-name">${s.name}</div></div>
          <div class="dd-price${loadingClass}">${priceText}</div>
        </button>
      `;
    }).join('');

    dropdown.querySelectorAll('.dropdown-item').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        selectService(btn.dataset.id);
      });
    });
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) dropdown.classList.remove('active');
  });

  function selectService(id) {
    const svc = allServices.find(s => s.id === id);
    if (!svc) return;

    const pd = priceCache[svc.rawName];
    if (!pd) return;

    selectedService = svc;
    selectedPriceNGN = pd.ngn;

    searchInput.value = svc.name;
    dropdown.classList.remove('active');

    selectedChip.style.display = 'flex';
    selectedName.textContent = svc.name;

    selectedPrice.textContent = fmtNaira(pd.ngn);
    priceCard.style.display = 'block';

    actionBtn.disabled = false;
    actionBtnText.textContent = 'Purchase Now';
  }

  /* ✅ PURCHASE NOW — goes straight to processing, no confirm modal */
  actionBtn.addEventListener('click', async () => {
    if (!selectedService) return;
    const price = Number(selectedPriceNGN);

    // Check balance before anything else
    if (userWallet < price) {
      const shortfall = price - userWallet;
      openModal(`
        <div class="modal-icon-top warning"><i class="fas fa-wallet"></i></div>
        <div class="modal-title">Not Enough Balance</div>
        <div class="modal-sub">You need ${fmtNaira(shortfall)} more to buy <strong>${selectedService.name}</strong>.</div>
        <div class="confirm-box">
          <div class="confirm-row"><span class="label">Service</span><span class="value">${selectedService.name}</span></div>
          <div class="confirm-row"><span class="label">Price</span><span class="value">${fmtNaira(price)}</span></div>
          <div class="confirm-row"><span class="label">Your Balance</span><span class="value">${fmtNaira(userWallet)}</span></div>
          <div class="confirm-row total"><span class="label">Shortfall</span><span class="value" style="color:var(--warning);">${fmtNaira(shortfall)}</span></div>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" id="mCancel">Cancel</button>
          <a href="wallet.html" class="btn-primary"><i class="fas fa-plus-circle"></i> Fund Wallet</a>
        </div>
      `);
      document.getElementById('mCancel').onclick = closeModal;
      return;
    }

    // Process purchase immediately
    await processPurchase();
  });

  async function processPurchase() {
    // Disable button and show processing state
    actionBtn.disabled = true;
    actionBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

    const price = Number(selectedPriceNGN);

    try {
      // 1. Check balance and get fresh user data
      const userRef = doc(db, 'users', currentUser.uid);
      const freshSnap = await getDoc(userRef);
      const freshData = freshSnap.data() || {};
      const freshBalance = Number(freshData.wallet ?? freshData.walletBalance ?? freshData.balance ?? 0);

      if (freshBalance < price) throw new Error('INSUFFICIENT');
      userWallet = freshBalance;

      // 2. Request number from provider
      const genRes = await fetch(`${USA_API}?action=generate&service=${encodeURIComponent(selectedService.rawName)}`);
      const genData = await genRes.json();

      // If provider has no number or no coin, show stock error
      if (!genRes.ok || !genData.success || !genData.id) {
        throw new Error('OUT_OF_STOCK');
      }

      const verifyId = genData.id;
      const phoneNumber = genData.number;

      if (!phoneNumber) {
        throw new Error('OUT_OF_STOCK');
      }

      // 3. Deduct balance from user wallet
      const newBalance = freshBalance - price;
      await updateDoc(userRef, {
        wallet: newBalance,
        updatedAt: serverTimestamp()
      });

      userWallet = newBalance;
      topBalance.textContent = fmtNaira(userWallet);

      // 4. Save order — matches your Firestore rules
      const orderRef = await addDoc(collection(db, 'orders'), {
        userId: currentUser.uid,
        userEmail: currentUser.email || '',
        service: selectedService.name,
        serviceName: selectedService.rawName,
        provider: 'textverified',
        category: 'USA',
        country: 'USA',
        countryCode: 'us',
        flag: '🇺🇸',
        verificationId: verifyId,
        phone: phoneNumber,
        price: price,
        amount: price,
        currency: 'NGN',
        status: 'waiting',
        createdAt: serverTimestamp()
      });

      // 5. Save transaction inside user's subcollection (matches your rules)
      await addDoc(collection(db, 'users', currentUser.uid, 'transactions'), {
        type: 'purchase',
        amount: price,
        currency: 'NGN',
        description: 'Bought ' + selectedService.name + ' (USA)',
        orderId: orderRef.id,
        createdAt: serverTimestamp()
      });

      // 6. Store active order in localStorage for dashboard
      try {
        localStorage.setItem('activeOrder', JSON.stringify({
          orderId: orderRef.id,
          verificationId: verifyId,
          country: 'us',
          countryName: 'USA',
          flag: '🇺🇸',
          phone: phoneNumber,
          price: price,
          serviceName: selectedService.name,
          provider: 'textverified',
          createdAt: Date.now()
        }));
      } catch (e) {}

      // 7. Redirect to dashboard
      window.location.href = 'dashboard.html';

    } catch (err) {
      // Restore button
      actionBtn.disabled = false;
      actionBtn.innerHTML = '<i class="fas fa-bolt"></i><span id="actionBtnText">Purchase Now</span>';

      let msg = 'Something went wrong. Please try again.';
      if (err.message === 'OUT_OF_STOCK') msg = 'Number out of stock. Please try again later.';
      else if (err.message === 'INSUFFICIENT') msg = 'Insufficient wallet balance.';
      else if (err.message && err.message.includes('permission')) msg = 'Account permission error. Please contact support.';
      else if (err.message) msg = err.message;

      openModal(`
        <div class="modal-icon-top error"><i class="fas fa-triangle-exclamation"></i></div>
        <div class="modal-title">Purchase Failed</div>
        <div class="modal-sub">${msg}</div>
        <div class="modal-actions">
          <button class="btn-cancel" id="mClose" style="flex:1;">Close</button>
        </div>
      `);
      document.getElementById('mClose').onclick = closeModal;
    }
  }
</script>

</body>
</html>
