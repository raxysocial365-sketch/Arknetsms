<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy All Countries — Arknet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
  :root {
    --brown-dark: #4a2c2a;
    --brown: #6b4423;
    --brown-light: #8b5e3c;
    --pink: #ec4899;
    --pink-dark: #be185d;
    --pink-light: #f9a8d4;
    --pink-soft: #fdf2f8;
    --white: #ffffff;
    --cream: #fef9f5;
    --green: #22c55e;
    --red: #dc2626;
  }
  html, body { overflow-x: hidden; }
  body {
    background: var(--cream); color: var(--brown-dark);
    min-height: 100vh; line-height: 1.5;
    padding-bottom: 110px;
    -webkit-font-smoothing: antialiased;
  }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  /* TOPBAR */
  .topbar { background: var(--brown-dark); position: sticky; top: 0; z-index: 500; }
  .topbar-inner { max-width: 560px; margin: 0 auto; padding: 0.75rem 1rem; display: flex; align-items: center; gap: 0.7rem; }
  .back-btn { width: 40px; height: 40px; border-radius: 12px; background: var(--white); display: flex; align-items: center; justify-content: center; font-size: 1rem; color: var(--brown-dark); flex-shrink: 0; }
  .page-title { font-size: 0.95rem; font-weight: 700; flex: 1; color: white; }

  /* CONTAINER */
  .container { max-width: 560px; margin: 0 auto; padding: 1rem 1rem 0; display: flex; flex-direction: column; gap: 1rem; }

  /* ==========================================
     HERO HEADER (same as USA page)
     ========================================== */
  .hero {
    position: relative;
    border-radius: 24px;
    padding: 1.4rem 1.3rem 1.5rem;
    background:
      radial-gradient(circle at 90% 10%, rgba(255,255,255,0.25) 0%, transparent 45%),
      radial-gradient(circle at 10% 90%, rgba(255,255,255,0.15) 0%, transparent 40%),
      linear-gradient(135deg, #ec4899 0%, #be185d 55%, #7f1d1d 130%);
    box-shadow: 0 18px 40px -18px rgba(190, 24, 93, 0.65);
    overflow: hidden;
    color: white;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: 18px; right: 70px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    box-shadow:
      20px 25px 0 rgba(255,255,255,0.2),
      50px -5px 0 rgba(255,255,255,0.25),
      80px 30px 0 rgba(255,255,255,0.15);
    pointer-events: none;
  }

  .hero-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
    margin-bottom: 1rem;
    position: relative;
    z-index: 1;
  }
  .hero-greet {
    font-size: 0.82rem;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .hero-greet strong {
    color: #fff;
    font-weight: 700;
    font-size: 0.9rem;
  }
  .hero-wallet {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.3);
    font-size: 0.78rem;
    font-weight: 700;
    color: #fff;
    backdrop-filter: blur(8px);
  }
  .hero-wallet i { font-size: 0.72rem; opacity: 0.9; }

  .hero-main {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    position: relative;
    z-index: 1;
  }
  .hero-flag {
    width: 58px; height: 58px;
    border-radius: 18px;
    background: rgba(255,255,255,0.18);
    border: 1.5px solid rgba(255,255,255,0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.9rem;
    flex-shrink: 0;
    backdrop-filter: blur(8px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
  }
  .hero-text { flex: 1; min-width: 0; }
  .hero-title {
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 0.01em;
    line-height: 1.2;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .live-pill {
    font-size: 0.6rem;
    font-weight: 800;
    padding: 3px 7px;
    border-radius: 999px;
    background: #fff;
    color: var(--pink-dark);
    letter-spacing: 0.06em;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .live-pill::before {
    content: '';
    width: 6px; height: 6px; border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 0 0 rgba(34,197,94,0.7);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.7); }
    70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
  }
  .hero-sub {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.85);
    margin-top: 4px;
    line-height: 1.4;
  }

  .hero-stats {
    display: flex;
    gap: 6px;
    margin-top: 1rem;
    position: relative;
    z-index: 1;
  }
  .hero-stat {
    flex: 1;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 10px;
    padding: 7px 6px;
    text-align: center;
    backdrop-filter: blur(6px);
  }
  .hero-stat .s-lbl {
    font-size: 0.6rem;
    font-weight: 600;
    color: rgba(255,255,255,0.75);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: block;
    margin-bottom: 2px;
  }
  .hero-stat .s-val {
    font-size: 0.76rem;
    font-weight: 800;
    color: #fff;
  }

  /* MAIN CARD */
  .main-card { background: var(--white); border: 1px solid #f5e6e0; border-radius: 20px; padding: 1.4rem 1.2rem; box-shadow: 0 4px 20px rgba(74,44,42,0.06); }
  .field-label { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; display: block; }
  .field-label .req { color: var(--red); margin-left: 2px; }

  .step-head { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.85rem; }
  .step-num {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--pink); color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.82rem; font-weight: 800;
    flex-shrink: 0;
  }
  .step-title { font-size: 0.95rem; font-weight: 800; color: var(--brown-dark); }

  .search-wrap { position: relative; margin-bottom: 0.6rem; }
  .search-wrap input { width: 100%; padding: 0.9rem 1rem; border: 1.5px solid #f0dcd4; outline: none; border-radius: 12px; font-size: 0.9rem; font-family: 'Poppins', sans-serif; background: var(--cream); color: var(--brown-dark); }
  .search-wrap input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(236,72,153,0.12); background: white; }
  .search-wrap input::placeholder { color: #b89b8f; }
  .search-wrap input:disabled { background: #f8f5f3; cursor: not-allowed; }

  .dropdown { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: #fff; border: 1.5px solid var(--pink); border-radius: 12px; box-shadow: 0 12px 30px rgba(236,72,153,0.15); max-height: 320px; overflow-y: auto; z-index: 100; display: none; }
  .dropdown.active { display: block; }
  .dropdown-item { width: 100%; padding: 0.85rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: 0.7rem; cursor: pointer; border-bottom: 1px solid #f0dcd4; text-align: left; }
  .dropdown-item:last-child { border-bottom: none; }
  .dropdown-item:hover { background: var(--pink-soft); }
  .dropdown-item .dd-left { display: flex; align-items: center; gap: 0.6rem; }
  .dropdown-item .dd-flag { font-size: 1.2rem; }
  .dropdown-item .dd-name { font-size: 0.88rem; font-weight: 600; color: var(--brown-dark); text-transform: capitalize; }
  .dropdown-item .dd-price { font-size: 0.88rem; font-weight: 800; color: var(--pink); flex-shrink: 0; }
  .dropdown-item .dd-code { font-size: 0.75rem; color: var(--brown-light); font-weight: 600; }
  .dropdown-empty { padding: 1rem; text-align: center; font-size: 0.82rem; color: var(--brown-light); }
  .dropdown-loading { padding: 1rem; text-align: center; font-size: 0.82rem; color: var(--brown-light); }

  .selected-chip { background: var(--pink-soft); border-radius: 12px; padding: 0.8rem 1rem; margin-bottom: 0.9rem; display: flex; align-items: center; gap: 0.6rem; font-size: 0.88rem; border: 1px solid var(--pink-light); }
  .selected-chip .lbl { color: var(--brown-light); font-weight: 500; }
  .selected-chip .val { font-weight: 700; color: var(--brown-dark); text-transform: capitalize; }

  .price-card { background: linear-gradient(135deg, var(--pink-soft), #fce7f3); border-radius: 14px; padding: 1.2rem 1rem; text-align: center; margin-bottom: 0.9rem; }
  .price-card .price { font-size: 1.5rem; font-weight: 800; color: var(--pink); }
  .price-card .price-note { font-size: 0.75rem; color: var(--brown-light); margin-top: 0.35rem; }

  .action-btn { width: 100%; padding: 1rem; border-radius: 14px; background: var(--pink); color: #fff; font-size: 0.95rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 0.5rem; box-shadow: 0 10px 30px rgba(236,72,153,0.3); transition: 0.25s; }
  .action-btn:hover:not(:disabled) { background: var(--brown-dark); transform: translateY(-2px); }
  .action-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(74,44,42,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 998; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal-box { background: white; border-radius: 24px; padding: 32px 26px; max-width: 440px; width: 100%; text-align: center; max-height: 90vh; overflow-y: auto; }
  .modal-icon { font-size: 46px; margin-bottom: 10px; }
  .modal-title { font-size: 22px; font-weight: 800; color: var(--brown-dark); margin-bottom: 6px; }
  .modal-sub { font-size: 14px; color: var(--brown-light); margin-bottom: 20px; line-height: 1.6; }
  .modal-detail { background: var(--pink-soft); border-radius: 14px; padding: 16px; margin-bottom: 22px; text-align: left; }
  .md-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; color: var(--brown-dark); gap: 12px; }
  .md-row span { color: var(--brown-light); font-weight: 600; }
  .md-row b { font-weight: 800; text-align: right; }
  .md-row.total { border-top: 1px solid var(--pink-light); margin-top: 6px; padding-top: 12px; font-size: 15px; }
  .md-row.total b { color: var(--pink); font-size: 16px; }
  .modal-actions { display: flex; gap: 12px; }
  .btn-cancel { padding: 13px; border-radius: 10px; background: #e5e7eb; color: var(--brown-dark); font-weight: 700; font-size: 14px; font-family: inherit; border: none; }
  .btn-primary { background: var(--pink); color: white; padding: 13px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn-primary:hover { background: var(--brown-dark); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

  /* TOAST */
  .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--brown-dark); color: white; padding: 13px 22px; border-radius: 10px; font-size: 14px; font-weight: 600; opacity: 0; transition: 0.3s; z-index: 999; pointer-events: none; max-width: 90%; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--green); }
  .toast.error { background: var(--red); }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 14px; left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 24px); max-width: 500px;
    background: var(--white); border-radius: 22px;
    box-shadow: 0 12px 36px rgba(74,44,42,0.18), 0 2px 8px rgba(74,44,42,0.08);
    padding: 8px 6px; z-index: 400;
  }
  .bn-inner { width: 100%; display: flex; justify-content: space-around; align-items: center; }
  .bn-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: transparent; border: none; color: #9ca3af; font-size: 10px; font-weight: 600; cursor: pointer; padding: 6px 2px; border-radius: 16px; transition: 0.25s; font-family: inherit; text-decoration: none; min-height: 56px; }
  .bn-item .bn-icon { width: 34px; height: 34px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  .bn-item .bn-icon svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .bn-item.active { color: var(--brown-dark); font-weight: 700; }
  .bn-item.active .bn-icon { background: var(--pink-soft); color: var(--pink); }
  .bn-item.active .bn-icon svg { stroke: var(--pink); }
  .bn-item.logout { color: #dc2626; }

  @media (min-width: 700px) { .container, .topbar-inner, .modal-box { max-width: 640px; } }
  @media (max-width: 600px) {
    .bn-item { font-size: 8.5px; }
    .bn-item .bn-icon { width: 30px; height: 30px; }
    .bn-item .bn-icon svg { width: 18px; height: 18px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="hero">

</div>

      <span>Orders</span>

    <a href="wallet.html" class="bn-item">
      <span class="bn-icon"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="2.5"/><path d="M2 10h20"/><path d="M6 15h3"/></svg></span>

<div class="modal-overlay" id="purchaseModal"><div class="modal-box" id="modalContent"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, updateDoc, deleteField, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBFm455uDjJ8z8mtMTHvas7ikT0zsS7Je8",
    authDomain: "arknetsms-430ee.firebaseapp.com",
    projectId: "arknetsms-430ee",
    storageBucket: "arknetsms-430ee.firebasestorage.app",
    messagingSenderId: "961504742152",
    appId: "1:961504742152:web:a9ade98d13465bb3b8babd",
    measurementId: "G-48V2T4CBJF"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const API_URL = "/api/autofications-buy";
  const USD_TO_NGN = 1550, PROFIT_NGN = 850;

  const toast = document.getElementById('toast');
  const showToast = (text, type = '') => {
    toast.textContent = text;
    toast.className = 'toast show ' + type;
    setTimeout(() => toast.className = 'toast ' + type, 2800);
  };
  const formatNGN = (n) => '₦' + Number(n || 0).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const formatNGNshort = (n) => '₦' + Number(n || 0).toLocaleString('en-NG');
  const capitalize = (v) => String(v || '').replace(/\b\w/g, c => c.toUpperCase());
  const escapeHtml = (v) => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  const calcPrice = (usd) => Math.ceil((Number(usd || 0) * USD_TO_NGN) + PROFIT_NGN);
  const calcCost = (usd) => Math.ceil(Number(usd || 0) * USD_TO_NGN);

  let currentUser = null, currentBalance = 0, selectedCountry = null, selectedService = null, availableServices = [];

  /* Logout */
  document.getElementById('bnLogout').addEventListener('click', async () => {
    try { await signOut(auth); } catch (e) {}
    window.location.replace('login.html');
  });

  function openModal(html){
    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('purchaseModal').classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  function closeModal(){
    document.getElementById('purchaseModal').classList.remove('show');
    document.body.style.overflow = '';
  }
  document.getElementById('purchaseModal').addEventListener('click', e => {
    if (e.target.id === 'purchaseModal') closeModal();
  });

  const COUNTRIES = [
    {name:"United Kingdom", code:"UK", flag:"🇬🇧"},{name:"United States", code:"US1", flag:"🇺🇸"},{name:"France", code:"FR", flag:"🇫🇷"},{name:"Hong Kong", code:"HK", flag:"🇭🇰"},{name:"China", code:"CN", flag:"🇨🇳"},{name:"Germany", code:"DE", flag:"🇩🇪"},{name:"Netherlands", code:"NL", flag:"🇳🇱"},{name:"Malaysia", code:"MY", flag:"🇲🇾"},{name:"Brazil", code:"BR", flag:"🇧🇷"},{name:"India", code:"IND", flag:"🇮🇳"},{name:"Philippines", code:"PH", flag:"🇵🇭"},{name:"Spain", code:"ES", flag:"🇪🇸"},{name:"Argentina", code:"AR", flag:"🇦🇷"},{name:"New Zealand", code:"NZ", flag:"🇳🇿"},{name:"Ukraine", code:"UA", flag:"🇺🇦"},{name:"Sweden", code:"SE", flag:"🇸🇪"},{name:"Poland", code:"PL", flag:"🇵🇱"},{name:"India (IN1)", code:"IN1", flag:"🇮🇳"},{name:"Vietnam", code:"VN", flag:"🇻🇳"},{name:"Romania", code:"RO", flag:"🇷🇴"},{name:"Portugal", code:"PT", flag:"🇵🇹"},{name:"Turkey", code:"TR", flag:"🇹🇷"},{name:"Estonia", code:"EE", flag:"🇪🇪"},{name:"Israel", code:"IL", flag:"🇮🇱"}
  ];

  const countryInput = document.getElementById('countryInput');
  const countryDropdown = document.getElementById('countryDropdown');
  const serviceInput = document.getElementById('serviceInput');
  const serviceDropdown = document.getElementById('serviceDropdown');

  /* COUNTRY SEARCH */
  countryInput.addEventListener('input', () => {
    const q = countryInput.value.trim().toLowerCase();
    if (!q) { countryDropdown.classList.remove('active'); return; }
    const matches = COUNTRIES.filter(c => c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q)).slice(0, 12);
    if (!matches.length) {
      countryDropdown.innerHTML = `<div class="dropdown-empty">🔍 No country found</div>`;
      countryDropdown.classList.add('active');
      return;
    }
    countryDropdown.innerHTML = matches.map(c => `
      <button type="button" class="dropdown-item" data-code="${escapeHtml(c.code)}">
        <div class="dd-left">
          <span class="dd-flag">${c.flag}</span>
          <span class="dd-name">${escapeHtml(c.name)}</span>
        </div>
        <span class="dd-code">${c.code}</span>
      </button>
    `).join('');
    countryDropdown.classList.add('active');
    countryDropdown.querySelectorAll('.dropdown-item').forEach(btn => {
      btn.addEventListener('click', () => selectCountry(btn.dataset.code));
    });
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('#countryInput') && !countryDropdown.contains(e.target)) countryDropdown.classList.remove('active');
    if (!e.target.closest('#serviceInput') && !serviceDropdown.contains(e.target)) serviceDropdown.classList.remove('active');
  });

  async function selectCountry(code){
    const country = COUNTRIES.find(c => c.code.toLowerCase() === String(code).toLowerCase());
    if (!country) return;
    selectedCountry = country;
    selectedService = null;
    availableServices = [];
    serviceInput.value = '';
    document.getElementById('selectedChip').style.display = 'none';
    document.getElementById('priceCard').style.display = 'none';
    document.getElementById('actionBtn').disabled = true;
    countryInput.value = `${country.flag} ${country.name}`;
    countryDropdown.classList.remove('active');

    /* Update hero */
    document.getElementById('heroFlag').textContent = country.flag;
    document.getElementById('heroTitle').textContent = `${country.name} SMS`;
    document.getElementById('heroSub').textContent = `Real ${country.name} SIM numbers. Fast & reliable.`;

    document.getElementById('serviceCard').style.display = 'block';
    serviceInput.disabled = true;
    serviceInput.placeholder = 'Loading services...';
    serviceDropdown.innerHTML = '';
    serviceDropdown.classList.remove('active');

    try {
      const res = await fetch(`${API_URL}?action=servicelist&country=${encodeURIComponent(country.code)}`, { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok || !data.success) { serviceInput.placeholder = data.message || 'Failed'; return; }
      availableServices = (data.services || []).map(s => ({ id: String(s.id), name: String(s.name), price: Number(s.price || 0) }));
      if (!availableServices.length) { serviceInput.placeholder = 'No services'; return; }
      serviceInput.placeholder = `🔍 Search among ${availableServices.length} services...`;
      serviceInput.disabled = false;
    } catch (err) { serviceInput.placeholder = 'Failed to load services'; }
  }

  /* SERVICE SEARCH */
  serviceInput.addEventListener('input', () => {
    if (!selectedCountry) return;
    const q = serviceInput.value.trim().toLowerCase();
    if (!q) { serviceDropdown.classList.remove('active'); return; }
    const matches = availableServices.filter(s => s.name.toLowerCase().includes(q)).slice(0, 12);
    if (!matches.length) {
      serviceDropdown.innerHTML = `<div class="dropdown-empty">🔍 No service found</div>`;
      serviceDropdown.classList.add('active');
      return;
    }
    serviceDropdown.innerHTML = matches.map(s => {
      const price = calcPrice(s.price);
      return `<button type="button" class="dropdown-item" data-id="${escapeHtml(s.id)}">
        <div class="dd-left">
          <span class="dd-flag">📱</span>
          <span class="dd-name">${escapeHtml(capitalize(s.name))}</span>
        </div>
        <span class="dd-price">${formatNGNshort(price)}</span>
      </button>`;
    }).join('');
    serviceDropdown.classList.add('active');
    serviceDropdown.querySelectorAll('.dropdown-item').forEach(btn => {
      btn.addEventListener('click', () => selectService(btn.dataset.id));
    });
  });

  function selectService(id){
    const service = availableServices.find(s => String(s.id) === String(id));
    if (!service) return;
    selectedService = service;
    serviceInput.value = capitalize(service.name);
    serviceDropdown.classList.remove('active');
    const price = calcPrice(service.price);
    document.getElementById('selectedChip').style.display = 'flex';
    document.getElementById('selectedName').textContent = `${selectedCountry.flag} ${capitalize(service.name)}`;
    document.getElementById('selectedPrice').textContent = formatNGN(price);
    document.getElementById('priceCard').style.display = 'block';
    document.getElementById('actionBtn').disabled = false;
  }

  /* PURCHASE */
  document.getElementById('actionBtn').addEventListener('click', () => {
    if (!currentUser || !selectedCountry || !selectedService) return;
    const price = calcPrice(selectedService.price);
    if (currentBalance < price) {
      const shortfall = price - currentBalance;
      openModal(`<div class="modal-icon">⚠️</div><div class="modal-title">Not Enough Balance</div>
        <div class="modal-sub">You need <b>${formatNGN(shortfall)}</b> more.</div>
        <div class="modal-detail">
          <div class="md-row"><span>Service</span><b>${escapeHtml(capitalize(selectedService.name))}</b></div>
          <div class="md-row"><span>Country</span><b>${selectedCountry.flag} ${escapeHtml(selectedCountry.name)}</b></div>
          <div class="md-row"><span>Price</span><b>${formatNGN(price)}</b></div>
          <div class="md-row"><span>Balance</span><b>${formatNGN(currentBalance)}</b></div>
          <div class="md-row total"><span>Shortfall</span><b>${formatNGN(shortfall)}</b></div>
        </div>
        <div class="modal-actions"><button class="btn-cancel" style="flex:1;" id="mCancel">Cancel</button>
        <button class="btn-primary" style="flex:2;" id="mFund">💰 Fund</button></div>`);
      document.getElementById('mCancel').onclick = closeModal;
      document.getElementById('mFund').onclick = () => { window.location.href = 'wallet.html'; };
      return;
    }
    /* Process purchase directly (no confirm modal, matches USA page) */
    processPurchase();
  });

  async function processPurchase() {
    const btn = document.getElementById('actionBtn');
    btn.disabled = true;
    btn.textContent = '⏳ Processing...';

    const price = calcPrice(selectedService.price);
    const providerCost = calcCost(selectedService.price);
    const profit = price - providerCost;

    try {
      const userRef = doc(db, 'users', currentUser.uid);
      const freshSnap = await getDoc(userRef);
      const freshData = freshSnap.data() || {};
      const freshBalance = Number(freshData.wallet ?? freshData.walletBalance ?? freshData.balance ?? 0);
      if (freshBalance < price) throw new Error('INSUFFICIENT');

      const genRes = await fetch(`${API_URL}?action=generate&website=${encodeURIComponent(selectedService.id)}&country=${encodeURIComponent(selectedCountry.code)}`, { cache: 'no-store' });
      const genData = await genRes.json();
      if (!genRes.ok || !genData.success) throw new Error(genData.message || 'OUT_OF_STOCK');
      const phoneNumber = genData.number;
      if (!phoneNumber) throw new Error('OUT_OF_STOCK');

      const newBalance = freshBalance - price;
      await updateDoc(userRef, { wallet: newBalance, walletBalance: deleteField(), balance: deleteField(), updatedAt: serverTimestamp() });
      currentBalance = newBalance;
      document.getElementById('heroBalance').textContent = formatNGN(currentBalance);

      await addDoc(collection(db, 'users', currentUser.uid, 'activations'), {
        service: capitalize(selectedService.name),
        serviceId: selectedService.id,
        country: selectedCountry.name,
        countryCode: selectedCountry.code,
        flag: selectedCountry.flag,
        number: phoneNumber,
        code: '',
        price,
        providerCost,
        profit,
        status: 'pending',
        provider: 'autofications',
        createdAt: serverTimestamp()
      });

      await addDoc(collection(db, 'users', currentUser.uid, 'transactions'), {
        type: 'purchase',
        icon: selectedCountry.flag,
        title: `${selectedCountry.name} — ${capitalize(selectedService.name)}`,
        subtitle: `Number: ${phoneNumber}`,
        amount: price,
        createdAt: serverTimestamp()
      });

      showToast(`✅ Number: ${phoneNumber}`, 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);

    } catch (err) {
      btn.disabled = false;
      btn.textContent = '🛒 Purchase Now';
      const msg = err.message === 'INSUFFICIENT' ? 'Insufficient wallet balance.'
                : err.message === 'OUT_OF_STOCK' ? 'Number out of stock. Please try again later.'
                : (err.message || 'Something went wrong.');
      openModal(`<div class="modal-icon">❌</div><div class="modal-title">Purchase Failed</div>
        <div class="modal-sub">${escapeHtml(msg)}</div>
        <div class="modal-actions"><button class="btn-cancel" style="flex:1;" id="mClose">Close</button></div>`);
      document.getElementById('mClose').onclick = closeModal;
    }
  }

  /* AUTH */
  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }
    currentUser = user;
    const name = (user.displayName || user.email.split('@')[0]).split(' ')[0];
    document.getElementById('heroName').textContent = name.charAt(0).toUpperCase() + name.slice(1);

    try {
      const snap = await getDoc(doc(db, 'users', user.uid));
      if (snap.exists()) {
        const data = snap.data();
        currentBalance = Number(data.wallet ?? data.walletBalance ?? data.balance ?? 0);
        document.getElementById('heroBalance').textContent = formatNGN(currentBalance);
      }
    } catch (e) {}
  });
</script>
