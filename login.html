<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arknet SMS — Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  :root {
    --brown-dark: #4a2c2a;
    --brown: #6b4423;
    --brown-light: #8b5e3c;
    --pink: #ec4899;
    --pink-light: #f9a8d4;
    --pink-soft: #fdf2f8;
    --white: #ffffff;
    --cream: #fef9f5;
    --green: #22c55e;
    --red: #dc2626;
  }
  body {
    background: var(--cream);
    color: var(--brown-dark);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 16px;
    position: relative;
    overflow-x: hidden;
  }
  .bg-blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.4; z-index: 0; pointer-events: none; }
  .blob-1 { width: 320px; height: 320px; background: var(--pink); top: -80px; left: -80px; }
  .blob-2 { width: 280px; height: 280px; background: var(--brown-light); bottom: -60px; right: -60px; }

  .auth-card {
    background: var(--white);
    border-radius: 24px;
    padding: 40px 34px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 25px 60px rgba(74,44,42,0.18);
    border: 1px solid #f5e6e0;
    position: relative;
    z-index: 2;
  }
  .brand { text-align: center; margin-bottom: 26px; }
  .logo { font-size: 26px; font-weight: 800; color: var(--brown-dark); letter-spacing: -0.5px; }
  .logo span { color: var(--pink); }
  .brand p { font-size: 13px; color: var(--brown-light); margin-top: 6px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 700; color: var(--brown-dark); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 13px 14px;
    border: 1.5px solid #f0dcd4; border-radius: 10px;
    font-size: 14px; color: var(--brown-dark); background: var(--cream);
    transition: 0.2s; font-family: inherit;
  }
  .field input:focus {
    outline: none; border-color: var(--pink);
    background: var(--white); box-shadow: 0 0 0 4px rgba(236,72,153,0.1);
  }
  .field input::placeholder { color: #b89b8f; }

  .pass-wrap { position: relative; }
  .pass-wrap input { padding-right: 44px; }
  .toggle-eye {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    cursor: pointer; font-size: 16px; color: var(--brown-light);
    user-select: none; padding: 4px;
  }

  .forgot { text-align: right; margin-top: 8px; margin-bottom: 18px; }
  .forgot a { color: var(--pink); font-size: 13px; font-weight: 700; text-decoration: none; cursor: pointer; }
  .forgot a:hover { text-decoration: underline; }

  .btn-submit {
    width: 100%; padding: 14px;
    background: var(--pink); color: white;
    border: none; border-radius: 10px;
    font-size: 15px; font-weight: 700;
    cursor: pointer; transition: 0.25s;
    font-family: inherit;
  }
  .btn-submit:hover { background: var(--brown-dark); transform: translateY(-1px); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .msg {
    padding: 11px 14px; border-radius: 10px;
    font-size: 13px; font-weight: 600;
    margin-bottom: 14px; display: none; text-align: center;
  }
  .msg.error { background: #fee2e2; color: #991b1b; display: block; }
  .msg.success { background: #dcfce7; color: #166534; display: block; }
  .msg.info { background: #dbeafe; color: #1e40af; display: block; }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 20px 0 14px; color: #b89b8f;
    font-size: 12px; font-weight: 600;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #f0dcd4; }

  .bottom-text { text-align: center; font-size: 13px; color: var(--brown-light); margin-top: 18px; }
  .bottom-text a { color: var(--pink); font-weight: 700; text-decoration: none; cursor: pointer; }
  .bottom-text a:hover { text-decoration: underline; }

  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white; border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 8px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .auth-card { padding: 30px 22px; border-radius: 20px; }
    .logo { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>

<div class="auth-card">
  <div class="brand">
    <div class="logo">Arknet<span>SMS</span></div>
    <p>Login to your account</p>
  </div>

  <div class="msg" id="msg"></div>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="you@gmail.com" autocomplete="email" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="pass-wrap">
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        <span class="toggle-eye" data-target="password">👁️</span>
      </div>
    </div>

    <div class="forgot">
      <a id="forgotLink">Forgot password?</a>
    </div>

    <button type="submit" class="btn-submit" id="loginBtn">Login</button>

    <div class="divider">OR</div>

    <div class="bottom-text">
      Don't have an account? <a href="signup.html">Create Account</a>
    </div>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBFm455uDjJ8z8mtMTHvas7ikT0zsS7Je8",
    authDomain: "arknetsms-430ee.firebaseapp.com",
    projectId: "arknetsms-430ee",
    storageBucket: "arknetsms-430ee.firebasestorage.app",
    messagingSenderId: "961504742152",
    appId: "1:961504742152:web:a9ade98d13465bb3b8babd",
    measurementId: "G-48V2T4CBJF"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const msg = document.getElementById('msg');
  const showMsg = (text, type = 'error') => {
    msg.textContent = text;
    msg.className = 'msg ' + type;
    if (type === 'success') setTimeout(() => msg.className = 'msg', 4000);
  };
  const setLoading = (btn, loading, text = '') => {
    btn.disabled = loading;
    btn.innerHTML = loading ? `<span class="spinner"></span>${text}` : text;
  };

  document.querySelectorAll('.toggle-eye').forEach(eye => {
    eye.addEventListener('click', () => {
      const input = document.getElementById(eye.dataset.target);
      input.type = input.type === 'password' ? 'text' : 'password';
      eye.textContent = input.type === 'password' ? '👁️' : '🙈';
    });
  });

  /* ============ LOGIN ============ */
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) return showMsg('Please enter email and password.');

    setLoading(btn, true, 'Logging in...');
    try {
      // Step 1: Sign in with Firebase Auth
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const uid = cred.user.uid;

      console.log('Logged in UID:', uid);

      // Step 2: Check if user is admin (Firestore)
      let isAdmin = false;
      try {
        const snap = await getDoc(doc(db, 'users', uid));
        if (snap.exists()) {
          const data = snap.data();
          console.log('User doc:', data);
          if (data.isAdmin === true) {
            isAdmin = true;
          }
        }
      } catch (err) {
        console.warn('Could not check admin status:', err.message);
      }

      // Step 3: Redirect based on role
      if (isAdmin) {
        showMsg('✅ Welcome, Admin! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'admin/dashboard.html';
        }, 900);
      } else {
        showMsg('Login successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 900);
      }

    } catch (err) {
      console.error(err);
      const map = {
        'auth/invalid-credential': 'Wrong email or password.',
        'auth/user-not-found': 'No account found with this email.',
        'auth/wrong-password': 'Incorrect password.',
        'auth/too-many-requests': 'Too many attempts. Try again later.',
        'auth/invalid-email': 'Invalid email address.'
      };
      showMsg(map[err.code] || err.message);
      setLoading(btn, false, 'Login');
    }
  });

  /* ============ FORGOT PASSWORD ============ */
  document.getElementById('forgotLink').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    if (!email) return showMsg('Enter your email first, then click Forgot password.');
    try {
      await sendPasswordResetEmail(auth, email);
      showMsg('Reset link sent! Check your inbox.', 'success');
    } catch (err) {
      showMsg(err.message);
    }
  });

  /* ============ AUTO-REDIRECT IF LOGGED IN ============ */
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      let isAdmin = false;
      try {
        const snap = await getDoc(doc(db, 'users', user.uid));
        if (snap.exists() && snap.data().isAdmin === true) isAdmin = true;
      } catch (e) {}

      if (isAdmin) {
        window.location.href = 'admin/dashboard.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    }
  });
</script>

</body>
</html>
